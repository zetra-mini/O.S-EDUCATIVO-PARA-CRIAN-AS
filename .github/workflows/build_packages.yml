name: Compilar Pacotes e Releases do JARVIS Kids OS

'on':
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Versão da Release (opcional, ex: 3.9.6)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-packages:
    name: Compilar Pacotes (.deb, .tar.gz, .zip, .apk, .app, pkg)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar Versão da Release
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            RAW_VER="${{ github.event.inputs.release_version }}"
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            RAW_VER="${GITHUB_REF_NAME#v}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="3.9.6"
          fi
          echo "VERSION=${RAW_VER}" >> $GITHUB_ENV
          echo "TAG_NAME=v${RAW_VER}" >> $GITHUB_ENV
          echo "Versão configurada: ${RAW_VER} (Tag: v${RAW_VER})"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar Java 17 (Para Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Ferramentas de Build
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dpkg-dev binutils tar gzip zip
          python -m pip install --upgrade pip
          pip install microdot edge-tts

      - name: Validar Sintaxe dos Scripts Python e Utilitários
        run: |
          echo "Testando compilação Python..."
          python3 -m py_compile run_server.py jarvis_brain.py deploy/desktop_app/jarvis_desktop.py
          chmod +x pkg pkg.sh gerar_deb.sh deploy/android_app/build_apk.sh
          echo "Sintaxe validada com sucesso!"

      - name: 1. Compilar Pacote Debian Kiosk (.deb)
        run: |
          VERSION="${VERSION:-3.9.6}"
          ARCH="all"
          DEB_DIR="jarvis-kids-os_${VERSION}_${ARCH}"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/opt/jarvis-kids-os"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"

          # Copia arquivos do sistema
          cp -r ./* "${DEB_DIR}/opt/jarvis-kids-os/" 2>/dev/null || true
          rm -rf "${DEB_DIR}/opt/jarvis-kids-os/${DEB_DIR}"

          # Assegura permissões do utilitário pkg
          chmod +x "${DEB_DIR}/opt/jarvis-kids-os/pkg" 2>/dev/null || true
          chmod +x "${DEB_DIR}/opt/jarvis-kids-os/pkg.sh" 2>/dev/null || true

          # Script executável principal /usr/bin/jarvis-kids
          cat << 'EOF' > "${DEB_DIR}/usr/bin/jarvis-kids"
          #!/bin/sh
          if [ -f /opt/jarvis-kids-os/iniciar_web_kiosk.sh ]; then
            exec /opt/jarvis-kids-os/iniciar_web_kiosk.sh "$@"
          elif [ -f /opt/jarvis-kids-os/iniciar_jarvis_linux.sh ]; then
            exec /opt/jarvis-kids-os/iniciar_jarvis_linux.sh "$@"
          else
            exec python3 /opt/jarvis-kids-os/run_server.py 8000 "$@"
          fi
          EOF
          chmod +x "${DEB_DIR}/usr/bin/jarvis-kids"

          # Script /usr/bin/jarvis-pkg para gerenciar via comando pkg
          cat << 'EOF' > "${DEB_DIR}/usr/bin/jarvis-pkg"
          #!/bin/sh
          exec /opt/jarvis-kids-os/pkg "$@"
          EOF
          chmod +x "${DEB_DIR}/usr/bin/jarvis-pkg"

          # Arquivo .desktop
          cat << 'EOF' > "${DEB_DIR}/usr/share/applications/jarvis-kids.desktop"
          [Desktop Entry]
          Name=JARVIS Kids OS
          Comment=Sistema Operacional Educativo Inteligente para Crianças
          Exec=/usr/bin/jarvis-kids
          Icon=/opt/jarvis-kids-os/static/icons/icon-192.png
          Terminal=false
          Type=Application
          Categories=Education;KidsGame;
          EOF

          # Metadados de controle DEBIAN
          cat << EOF > "${DEB_DIR}/DEBIAN/control"
          Package: jarvis-kids-os
          Version: ${VERSION}
          Section: education
          Priority: optional
          Architecture: ${ARCH}
          Depends: python3, python3-pip, chromium-browser | google-chrome-stable | firefox
          Maintainer: Equipe Jarvis Kids OS <contato@jarvis-kids.local>
          Description: Sistema Operacional Educativo Inteligente para Criancas
           O JARVIS Kids OS transforma netbooks modestos e desktops comuns em uma
           estacao educativa completa e segura, com IA afetuosa, controle dos pais e jogos.
          EOF

          dpkg-deb --build "${DEB_DIR}"
          mv "${DEB_DIR}.deb" jarvis-kids-os_${VERSION}.deb
          echo "Pacote .deb gerado com sucesso: jarvis-kids-os_${VERSION}.deb"

      - name: 2. Empacotar Versão Desktop Linux (.tar.gz)
        run: |
          VERSION="${VERSION:-3.9.6}"
          TAR_DIR="jarvis-kids-os-${VERSION}-linux-desktop"
          mkdir -p "${TAR_DIR}"
          cp -r ./* "${TAR_DIR}/" 2>/dev/null || true
          rm -rf "${TAR_DIR}/${TAR_DIR}"
          rm -f "${TAR_DIR}"/*.deb "${TAR_DIR}"/*.tar.gz "${TAR_DIR}"/*.zip "${TAR_DIR}"/*.apk "${TAR_DIR}"/*.app.zip
          tar -czf "jarvis-kids-os-${VERSION}-linux-desktop.tar.gz" "${TAR_DIR}"
          echo "Bundle Linux gerado com sucesso: jarvis-kids-os-${VERSION}-linux-desktop.tar.gz"

      - name: 3. Empacotar Versão Desktop Windows (.zip)
        run: |
          VERSION="${VERSION:-3.9.6}"
          ZIP_DIR="jarvis-kids-os-${VERSION}-windows-desktop"
          mkdir -p "${ZIP_DIR}"
          cp -r ./* "${ZIP_DIR}/" 2>/dev/null || true
          rm -rf "${ZIP_DIR}/${ZIP_DIR}"
          rm -f "${ZIP_DIR}"/*.deb "${ZIP_DIR}"/*.tar.gz "${ZIP_DIR}"/*.zip "${ZIP_DIR}"/*.apk "${ZIP_DIR}"/*.app.zip
          zip -r "jarvis-kids-os-${VERSION}-windows-desktop.zip" "${ZIP_DIR}"
          echo "Bundle Windows gerado com sucesso: jarvis-kids-os-${VERSION}-windows-desktop.zip"

      - name: 4. Compilar Aplicativo Android (.apk)
        run: |
          VERSION="${VERSION:-3.9.6}"
          echo "Compilando pacote Android .apk..."
          bash deploy/android_app/build_apk.sh
          echo "Pacote .apk gerado:"
          ls -la *.apk || true

      - name: 5. Empacotar Bundle macOS / Desktop (.app e .app.zip)
        run: |
          VERSION="${VERSION:-3.9.6}"
          echo "Estruturando bundle macOS .app..."
          APP_DIR="JARVIS-Kids-OS.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"
          
          # Copia Info.plist e inicializador
          cp deploy/macos_app/JARVIS-Kids-OS.app/Contents/Info.plist "${APP_DIR}/Contents/"
          cp deploy/macos_app/JARVIS-Kids-OS.app/Contents/MacOS/jarvis-kids "${APP_DIR}/Contents/MacOS/"
          chmod +x "${APP_DIR}/Contents/MacOS/jarvis-kids"
          
          # Copia código-fonte para dentro do Resources
          mkdir -p "${APP_DIR}/Contents/Resources/app"
          cp -r ./* "${APP_DIR}/Contents/Resources/app/" 2>/dev/null || true
          rm -rf "${APP_DIR}/Contents/Resources/app/${APP_DIR}"
          rm -f "${APP_DIR}/Contents/Resources/app"/*.deb "${APP_DIR}/Contents/Resources/app"/*.tar.gz "${APP_DIR}/Contents/Resources/app"/*.zip "${APP_DIR}/Contents/Resources/app"/*.apk "${APP_DIR}/Contents/Resources/app"/*.app.zip
          
          # Compacta o .app em .zip para distribuição no GitHub Releases
          zip -r "jarvis-kids-os-${VERSION}-macos.app.zip" "${APP_DIR}"
          echo "Bundle macOS .app e .app.zip gerados com sucesso!"

      - name: 6. Empacotar Instalador Standalone Universal PKG (.tar.gz)
        run: |
          VERSION="${VERSION:-3.9.6}"
          tar -czf "jarvis-kids-pkg-installer-${VERSION}.tar.gz" pkg pkg.sh
          echo "Instalador universal PKG gerado com sucesso!"

      - name: Salvar Artefatos de Compilação
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-kids-os-packages
          path: |
            *.deb
            *.tar.gz
            *.zip
            *.apk
            *.app.zip
            pkg
            pkg.sh

      - name: Publicar GitHub Release Oficial (Tag v* ou Branch main)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "JARVIS Kids OS v${{ env.VERSION }}"
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          make_latest: true
          files: |
            *.deb
            *.tar.gz
            *.zip
            *.apk
            *.app.zip
            pkg
            pkg.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
