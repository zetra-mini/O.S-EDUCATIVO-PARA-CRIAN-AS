name: Compilar Pacotes e Releases do JARVIS Kids OS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: Compilar Pacotes (.deb, .tar.gz, .zip, .apk, .app)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Determinar Versao da Release
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          if [ -z "$RAW_VER" ] || [ "$RAW_VER" = "main" ]; then
            RAW_VER="3.7.0"
          fi
          echo "VERSION=${RAW_VER}" >> $GITHUB_ENV
          echo "Versao configurada: ${RAW_VER}"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar Java 17 (Para Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Ferramentas de Build
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dpkg-dev binutils tar gzip zip
          python -m pip install --upgrade pip
          pip install microdot edge-tts

      - name: 1. Compilar Pacote Debian Kiosk (.deb)
        run: |
          VERSION="${VERSION:-3.7.0}"
          ARCH="all"
          DEB_DIR="jarvis-kids-os_${VERSION}_${ARCH}"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/opt/jarvis-kids-os"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"

          # Copia arquivos do sistema
          cp -r ./* "${DEB_DIR}/opt/jarvis-kids-os/" 2>/dev/null || true
          rm -rf "${DEB_DIR}/opt/jarvis-kids-os/${DEB_DIR}"

          # Script executavel /usr/bin/jarvis-kids
          cat << 'EOF' > "${DEB_DIR}/usr/bin/jarvis-kids"
          #!/bin/sh
          python3 /opt/jarvis-kids-os/deploy/desktop_app/jarvis_desktop.py "$@"
          EOF
          chmod +x "${DEB_DIR}/usr/bin/jarvis-kids"

          # Arquivo .desktop
          cat << 'EOF' > "${DEB_DIR}/usr/share/applications/jarvis-kids.desktop"
          [Desktop Entry]
          Name=JARVIS Kids OS
          Comment=Sistema Operacional Educativo Inteligente para Criancas
          Exec=/usr/bin/jarvis-kids
          Icon=/opt/jarvis-kids-os/static/icons/icon-192.png
          Terminal=false
          Type=Application
          Categories=Education;KidsGame;
          EOF

          # Metadados de controle DEBIAN
          cat << EOF > "${DEB_DIR}/DEBIAN/control"
          Package: jarvis-kids-os
          Version: ${VERSION}
          Section: education
          Priority: optional
          Architecture: ${ARCH}
          Depends: python3, python3-pip, chromium-browser | google-chrome-stable | firefox
          Maintainer: Equipe Jarvis Kids OS <contato@jarvis-kids.local>
          Description: Sistema Operacional Educativo Inteligente para Criancas
           O JARVIS Kids OS transforma netbooks modestos e desktops comuns em uma
           estacao educativa completa e segura, com IA afetuosa, controle dos pais e jogos.
          EOF

          dpkg-deb --build "${DEB_DIR}"
          mv "${DEB_DIR}.deb" jarvis-kids-os_${VERSION}.deb
          echo "Pacote .deb gerado com sucesso!"

      - name: 2. Empacotar Versao Desktop Linux (.tar.gz)
        run: |
          VERSION="${VERSION:-3.7.0}"
          TAR_DIR="jarvis-kids-os-${VERSION}-linux-desktop"
          mkdir -p "${TAR_DIR}"
          cp -r ./* "${TAR_DIR}/" 2>/dev/null || true
          rm -rf "${TAR_DIR}/${TAR_DIR}"
          rm -f "${TAR_DIR}"/*.deb "${TAR_DIR}"/*.tar.gz "${TAR_DIR}"/*.zip "${TAR_DIR}"/*.apk "${TAR_DIR}"/*.app.zip
          tar -czf "jarvis-kids-os-${VERSION}-linux-desktop.tar.gz" "${TAR_DIR}"
          echo "Bundle Linux gerado com sucesso!"

      - name: 3. Empacotar Versao Desktop Windows (.zip)
        run: |
          VERSION="${VERSION:-3.7.0}"
          ZIP_DIR="jarvis-kids-os-${VERSION}-windows-desktop"
          mkdir -p "${ZIP_DIR}"
          cp -r ./* "${ZIP_DIR}/" 2>/dev/null || true
          rm -rf "${ZIP_DIR}/${ZIP_DIR}"
          rm -f "${ZIP_DIR}"/*.deb "${ZIP_DIR}"/*.tar.gz "${ZIP_DIR}"/*.zip "${ZIP_DIR}"/*.apk "${ZIP_DIR}"/*.app.zip
          zip -r "jarvis-kids-os-${VERSION}-windows-desktop.zip" "${ZIP_DIR}"
          echo "Bundle Windows gerado com sucesso!"

      - name: 4. Compilar Aplicativo Android (.apk)
        run: |
          VERSION="${VERSION:-3.7.0}"
          echo "Compilando pacote Android .apk..."
          bash deploy/android_app/build_apk.sh
          echo "Pacote .apk gerado:"
          ls -la *.apk || true

      - name: 5. Empacotar Bundle macOS / Desktop (.app e .app.zip)
        run: |
          VERSION="${VERSION:-3.7.0}"
          echo "Estruturando bundle macOS .app..."
          APP_DIR="JARVIS-Kids-OS.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"
          
          # Copia Info.plist e inicializador
          cp deploy/macos_app/JARVIS-Kids-OS.app/Contents/Info.plist "${APP_DIR}/Contents/"
          cp deploy/macos_app/JARVIS-Kids-OS.app/Contents/MacOS/jarvis-kids "${APP_DIR}/Contents/MacOS/"
          chmod +x "${APP_DIR}/Contents/MacOS/jarvis-kids"
          
          # Copia codigo-fonte para dentro do Resources
          mkdir -p "${APP_DIR}/Contents/Resources/app"
          cp -r ./* "${APP_DIR}/Contents/Resources/app/" 2>/dev/null || true
          rm -rf "${APP_DIR}/Contents/Resources/app/${APP_DIR}"
          rm -f "${APP_DIR}/Contents/Resources/app"/*.deb "${APP_DIR}/Contents/Resources/app"/*.tar.gz "${APP_DIR}/Contents/Resources/app"/*.zip "${APP_DIR}/Contents/Resources/app"/*.apk "${APP_DIR}/Contents/Resources/app"/*.app.zip
          
          # Compacta o .app em .zip para distribuicao no GitHub Releases
          zip -r "jarvis-kids-os-${VERSION}-macos.app.zip" "${APP_DIR}"
          echo "Bundle macOS .app e .app.zip gerados com sucesso!"

      - name: Salvar Artefatos de Compilacao
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-kids-os-packages
          path: |
            *.deb
            *.tar.gz
            *.zip
            *.apk
            *.app.zip

      - name: Publicar GitHub Release Oficial (quando tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "JARVIS Kids OS ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            *.deb
            *.tar.gz
            *.zip
            *.apk
            *.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
